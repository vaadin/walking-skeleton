name: Refresh Branches

env:
  GH_TOKEN: ${{ github.token }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Template branch'
        required: true
        default: 'warning'
        type: choice
        options:
          - v24.7
          - v24.8

jobs:
  build_assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Maven ${inputs.maven-version}
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.6'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: |
          mvn clean package
          cd assembly/target
          ls *.zip
