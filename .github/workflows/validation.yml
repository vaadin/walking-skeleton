name: Validate

env:
  GH_TOKEN: ${{ github.token }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

on:  pull_request

jobs:
  build_assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.6'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: |
          mvn -ntp -B -q clean package
          cd target
          ASSEMBLIES=$(ls *.zip | jq -R -s -c 'split("\n")[:-1]')
          echo "ASSEMBLIES=$ASSEMBLIES" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: assemblies
          path: target/walking-skeleton-*.zip
    outputs:
      assemblies: ${{ env.ASSEMBLIES }}

  validate_assembly:
    runs-on: ubuntu-latest
    needs: build_assembly
    strategy:
      fail-fast: false
      matrix:
        assembly: ${{fromJson(needs.build_assembly.outputs.assemblies)}}
    steps:
      - run: |
          VIEWS=$(echo "${{ matrix.assembly }}" | awk '{print substr($0, 18, length($0)-21)}')
          echo "VIEWS=$VIEWS" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          name: assemblies
      - name: Unzip assembly
        run: |
          unzip walking-skeleton-${{ env.VIEWS }}.zip
          mv -f walking-skeleton/{.,}* .
          rmdir walking-skeleton
          rm walking-skeleton-*.zip
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.6'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build
        run: |
          mvn -ntp -B -q clean package
